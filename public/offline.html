<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12362C" />
    <title>Sedona Soul Offline</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4efe6;
        color: #16352b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      section {
        max-width: 420px;
        border-radius: 24px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 18px 40px -30px rgba(48, 30, 16, 0.35);
      }

      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 32px;
        font-weight: 400;
        line-height: 1.1;
      }

      p {
        margin: 12px 0 0;
        color: #7c7363;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>You are offline.</h1>
        <p>Sedona Soul needs a connection for chat, check-ins, progress, and safety resources. Please reconnect and try again.</p>
      </section>
    </main>
  </body>
</html>
